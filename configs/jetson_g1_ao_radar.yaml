# Dedicated Robot Follow AO Radar live config.
#
# It can be used alone, or as the final overlay after jetson_g1_safe.yaml:
#   robot-follow-ao-radar --config configs/jetson_g1_safe.yaml \
#     --config configs/jetson_g1_ao_radar.yaml
# Values in this file override matching values from the earlier file.
# Default output is mock so this file can be used for full ALX + FAST-LIO
# dry-runs without touching the G1 SDK. Set output.mode=g1 and
# confirm_real_g1=true only for deliberate low-speed real-G1 tests.

ao_radar:
  alx:
    port: /dev/ttyUSB0
    baudrate: 115200
    stale_timeout_s: 0.5
  # ALX 测距/方位低通滤波；越大越灵敏，越小越平滑。
  filter:
    alpha: 0.65
  # 跟随控制。目标在 target_distance_m ± hold_tolerance_m 时保持距离。
  follow:
    target_distance_m: 1.0
    min_safe_distance_m: 0.15
    hold_tolerance_m: 0.0
    max_forward_vx: 2.0
    max_backward_vx: 2.0
    max_follow_distance_m: 50.0
    max_omega: 3.0
    angle_deadzone_deg: 7.0
    large_angle_deg: 25.0
    distance_gain_forward: 0.5
    distance_gain_backward: 0.8
    angle_gain: 0.8
  # ALX 数据安全检查。follow.min_safe_distance_m 应与这里保持一致。
  safety:
    data_timeout_s: 0.5
    min_safe_distance_m: 0.15
    max_distance_jump_m: 0.5
    max_angle_jump_deg: 45.0
  # G1 实际输出限幅；即使 follow 输出更大，也会在此被截断。
  g1:
    max_vx: 0.9
    # AO 侧移避障输出的实体 G1 横向速度上限。
    max_vy: 0.45
    max_omega: 1.0
    yaw_sign: 1
    sdk_timeout_s: 10.0
    sdk_timeout_code: 3104
    sdk_timeout_retry_interval_s: 1.0
    max_consecutive_sdk_timeouts: 3
    command_timeout_s: 0.5
  # 避障 planner 限幅。这是下发 G1 前的最终速度上限，会截断 follow 段输出
  # （即便 follow.max_omega / g1.max_omega 更大，也以此为准）。
  # max_omega 偏低(0.8)会让机器人转身追不上手环、手环滑出雷达 FOV 而转圈；
  # 调高可加快对准。vx/vy 维持保守值以保留避障安全余量。
  avoidance:
    # 前方障碍时以可见的横移避开；最终仍受 avoidance.max_vy 和 g1.max_vy 限制。
    lateral_vy_mps: 0.30
    forward_vx_when_avoiding_mps: 0.05
    max_vx: 2.0
    max_vy: 0.30
    max_omega: 1.5
  radar:
    idle_stop_s: 5.0
    livox_start_command: "ros2 launch livox_ros_driver2 msg_MID360_launch.py"
    fast_lio_start_command: "ros2 launch fast_lio mapping.launch.py config_file:=/home/fk/g1_mid360_ros2_ws/src/FAST_LIO_ROS2/config/mid360.yaml rviz:=false"
    stop_timeout_s: 3.0
    ready_timeout_s: 10.0
  latency:
    ao_output_loop_hz: 40.0
    max_command_age_s: 0.2
    max_cloud_age_s: 0.5
    max_ao_process_ms: 20.0
    max_g1_dispatch_ms: 30.0
    warn_loop_dt_ms: 75.0
    hard_loop_dt_ms: 150.0
  output:
    mode: g1
    require_real_g1_confirmation: true
    confirm_real_g1: true
    network_interface: eth0
  logging:
    enabled: true
    csv_path: logs/ao_radar_frames.csv
    timestamped_runs: true
    filename_time_format: "%Y%m%d_%H%M%S"
    log_every_n_frames: 1
    terminal_summary_interval_s: 0.5
