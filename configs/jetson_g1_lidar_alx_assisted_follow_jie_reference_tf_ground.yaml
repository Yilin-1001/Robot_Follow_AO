# Jie-reference real-motion profile with the verified G1/MID360 static TF.
#
# Source of rigid transforms: Robot_Follow_Astar/configs/hardware/g1_mid360_alx.yaml
# body is FAST-LIO's MID360 IMU frame (FRD); base_link is the G1 control
# frame (FLU), 0.25 m below body.  Points are transformed in-process before
# the 0.15 m ground-height filter and the same fact is published on /tf_static.
extends: jetson_g1_lidar_alx_assisted_follow_jie_reference_real.yaml

lidar_alx_assisted_follow:
  alx_ros:
    frame_id: base_link

  sensors:
    # body (FRD) -> base_link (FLU): (x, y, z) -> (x, -y, -z) + (0, 0, 0.25)
    output_frame_id: base_link
    apply_body_to_output_transform: true
    body_to_output_roll_deg: 180.0
    body_to_output_pitch_deg: 0.0
    body_to_output_yaw_deg: 0.0
    body_to_output_x_m: 0.0
    body_to_output_y_m: 0.0
    body_to_output_z_m: 0.25
    # The complete RPY transform already changes FRD +Y to FLU +Y.
    cloud_y_sign: 1
    static_tf_start_command: >-
      ros2 run tf2_ros static_transform_publisher
      --x 0.0 --y 0.0 --z 0.25
      --roll 3.141592653589793 --pitch 0.0 --yaw 0.0
      --frame-id body --child-frame-id base_link

  calibration:
    # base_link is 1.00 m above floor; ALX receiver is 0.10 m ahead of it.
    x_m: 0.10
    y_m: 0.0
    lidar_height_m: 1.00
