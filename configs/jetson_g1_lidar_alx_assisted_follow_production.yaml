# Self-contained production configuration for G1 + MID-360 + ALX follow.
# This file is intentionally flattened: it has no `extends` dependency.
# Values match the previously merged production and base profiles.
lidar_alx_assisted_follow:
  alx:
    port: /dev/ttyUSB0
    baudrate: 115200
    stale_timeout_s: 0.5
    cloud_max_skew_s: 0.15
    min_distance_m: 0.1
    max_distance_m: 20.0
  alx_ros:
    topic: /alx/position
    wristband_topic: /alx/wristband_state
    frame_id: base_link
    poll_hz: 200.0
    wristband_publish_hz: 10.0
    wristband_timeout_s: 0.5
    kalman_process_noise: 0.05
    kalman_measurement_noise: 0.4
    kalman_max_interval_s: 0.2
  sensors:
    topic: /cloud_registered_body
    expected_frame_id: body
    cloud_y_sign: 1
    max_cloud_age_s: 0.25
    ready_timeout_s: 10.0
    stop_timeout_s: 3.0
    livox_start_command: ros2 launch livox_ros_driver2 msg_MID360_launch.py
    fast_lio_start_command: >-
      ros2 launch fast_lio mapping.launch.py
      config_path:=${FAST_LIO_CONFIG_DIR:?FAST_LIO_CONFIG_not_set}
      config_file:=${FAST_LIO_CONFIG_FILE:-mid360.yaml} rviz:=false
    output_frame_id: base_link
    apply_body_to_output_transform: true
    body_to_output_roll_deg: -178.081392
    body_to_output_pitch_deg: 32.651169
    body_to_output_yaw_deg: 1.035408
    body_to_output_x_m: 0.0
    body_to_output_y_m: 0.0
    body_to_output_z_m: 0.25
    static_tf_start_command: >-
      ros2 run tf2_ros static_transform_publisher
      --x 0.0 --y 0.0 --z 0.25
      --roll -3.108106620964 --pitch 0.569870397122 --yaw 0.018071270809
      --frame-id body --child-frame-id base_link
  g1:
    network_interface: enP8p1s0
    max_vx: 1.0
    max_abs_vy: 1.0
    max_abs_omega: 1.5
    yaw_sign: 1
    sdk_timeout_s: 10.0
    sdk_timeout_code: 3104
    sdk_timeout_retry_interval_s: 1.0
    max_consecutive_sdk_timeouts: 3
    command_timeout_s: 0.5
  output:
    mode: real
  runtime:
    watchdog_hz: 40.0
    max_strategy_age_s: 0.15
    max_strategy_process_ms: 20.0
    control_event_capacity: 32
  target:
    radial_min_m: 0.0
    radial_max_m: 3.0
    physical_height_min_m: 0.2
    physical_height_max_m: 1.4
    self_x_min_m: -0.35
    self_x_max_m: 0.15
    self_abs_y_max_m: 0.15
    voxel_size_m: 0.08
    web_pick_radius_m: 0.3
    gate_radial_radius_m: 0.45
    gate_tangential_radius_m: 0.35
    min_support_points: 8
    min_vertical_extent_m: 0.45
    max_horizontal_footprint_m: 0.9
    max_radial_mad_m: 0.18
    max_center_displacement_m: 0.35
    max_frame_interval_s: 0.2
    kalman_enabled: true
    kalman_process_noise: 0.1
    kalman_measurement_noise: 0.05
    lost_timeout_s: 0.75
    desired_distance_m: 1.0
    stop_distance_m: 0.8
  calibration:
    x_m: 0.1
    y_m: 0.0
    yaw_deg: 0.0
    azimuth_sign: 1
    azimuth_zero_offset_deg: 0.0
    lidar_height_m: 1.0
    alx_height_m: 1.1
    allow_provisional_calibration_for_prototype: true
  avoidance:
    mode: apf
  apf:
    target_desired_distance_m: 0.4
    target_stop_distance_m: 0.1
    non_target_influence_m: 0.3
    non_target_hard_stop_clearance_m: 0.12
    side_hard_clearance_m: 0.12
    slowdown_clearance_m: 0.3
    obstacle_x_min_m: -0.8
    obstacle_x_max_m: 2.5
    obstacle_abs_y_max_m: 1.2
    body_half_length_m: 0.3
    body_half_width_m: 0.225
    swept_margin_m: 0.1
    lateral_avoidance_half_width_m: 0.225
    swept_min_distance_m: 0.4
    swept_horizon_s: 1.0
    attraction_gain: 0.5
    corridor_gain: 1.0
    repulsion_gain: 0.012
    repulsion_cap: 0.8
    automatic_target_retreat_enabled: false
    target_retreat_start_distance_m: 0.85
    target_retreat_exit_distance_m: 1.0
    target_retreat_speed_mps: 0.2
    target_retreat_probe_distance_m: 0.12
    automatic_escape_enabled: false
    escape_speed_mps: 0.2
    escape_probe_distance_m: 1.1
    escape_max_duration_s: 5.0
    escape_min_clearance_gain_m: 0.02
    clearance_recovery_enabled: true
    clearance_recovery_min_speed_mps: 0.3
    clearance_recovery_max_speed_mps: 0.4
    clearance_recovery_max_duration_s: 10.0
    clearance_recovery_exit_margin_m: 0.02
    clearance_recovery_min_body_clearance_m: 0.03
    clearance_recovery_allow_forward: true
    omega_gain: 1.0
  output_motion:
    slew_rate_limit_enabled: false
    max_vx: 1.0
    max_reverse_vx: 1.0
    max_abs_vy: 1.0
    max_abs_omega: 1.5
    accel_vx: 3.0
    decel_vx: 6.0
    accel_vy: 2.0
    decel_vy: 4.0
    accel_omega: 8.0
    decel_omega: 16.0
  web:
    host: 127.0.0.1
    port: 8080
    max_clients: 8
    max_message_bytes: 4096
    max_events_per_second: 20.0
    status_hz: 10.0
    max_visualization_points: 3000
  logging:
    enabled: true
    csv_path: logs/lidar_alx_assisted_follow.csv
    flush_interval_s: 1.0
