# LiDAR + ALX Assisted Follow Configuration
# Prototype configuration for Jetson G1 deployment

lidar_alx_assisted_follow:
  alx:
    port: /dev/ttyUSB0
    baudrate: 115200
    stale_timeout_s: 0.50
    cloud_max_skew_s: 0.08
    min_distance_m: 0.10
    max_distance_m: 20.0

  # ALX ROS2 outputs.  The position topic carries only filtered body-frame
  # coordinates; the reliable wristband state topic retains hand-band control
  # of Livox/FAST-LIO startup and shutdown.
  alx_ros:
    topic: /alx/position
    wristband_topic: /alx/wristband_state
    frame_id: body
    poll_hz: 200.0
    wristband_publish_hz: 10.0
    wristband_timeout_s: 0.50
    kalman_process_noise: 0.05
    kalman_measurement_noise: 0.25
    kalman_max_interval_s: 0.20

  sensors:
    topic: /cloud_registered_body
    expected_frame_id: body
    # FAST-LIO's y axis is mirrored relative to this robot's body convention:
    # +x forward, +y left.  Flip only LiDAR points; ALX is calibrated separately.
    cloud_y_sign: -1
    max_cloud_age_s: 0.25
    ready_timeout_s: 10.0
    stop_timeout_s: 3.0
    livox_start_command: "ros2 launch livox_ros_driver2 msg_MID360_launch.py"
    fast_lio_start_command: "ros2 launch fast_lio mapping.launch.py config_file:=/home/fk/g1_mid360_ros2_ws/src/FAST_LIO_ROS2/config/mid360.yaml rviz:=false"

  g1:
    network_interface: eth0
    max_vx: 0.10
    max_abs_vy: 0.08
    max_abs_omega: 0.25
    yaw_sign: 1
    sdk_timeout_s: 10.0
    sdk_timeout_code: 3104
    sdk_timeout_retry_interval_s: 1.0
    max_consecutive_sdk_timeouts: 3
    command_timeout_s: 0.50

  output:
    mode: mock

  runtime:
    watchdog_hz: 40.0
    max_strategy_age_s: 0.15
    max_strategy_process_ms: 20.0
    control_event_capacity: 32

  target:
    radial_min_m: 0.25
    radial_max_m: 5.0
    physical_height_min_m: 0.10
    physical_height_max_m: 2.00
    self_x_min_m: -0.35
    self_x_max_m: 0.25
    self_abs_y_max_m: 0.25
    voxel_size_m: 0.05
    web_pick_radius_m: 0.35
    gate_radial_radius_m: 0.45
    gate_tangential_radius_m: 0.35
    min_support_points: 8
    min_vertical_extent_m: 0.45
    max_horizontal_footprint_m: 0.90
    max_radial_mad_m: 0.18
    max_center_displacement_m: 0.35
    max_frame_interval_s: 0.20
    kalman_enabled: true
    kalman_process_noise: 0.10
    kalman_measurement_noise: 0.05
    lost_timeout_s: 0.75
    desired_distance_m: 1.00
    stop_distance_m: 0.80

  calibration:
    x_m: 0.0
    y_m: 0.0
    yaw_deg: 0.0
    azimuth_sign: 1
    azimuth_zero_offset_deg: 0.0
    lidar_height_m: 1.25
    alx_height_m: 1.10
    allow_provisional_calibration_for_prototype: true

  confidence:
    weight_temporal: 0.35
    weight_geometry: 0.30
    weight_alx: 0.35
    alx_body_to_wrist_tolerance_m: 0.80
    no_observation_baseline: 0.0
    start: 0.80
    stop: 0.70
    unlock: 0.45

  apf:
    target_desired_distance_m: 1.00
    target_stop_distance_m: 0.80
    non_target_influence_m: 1.20
    non_target_hard_stop_clearance_m: 0.60
    body_half_length_m: 0.30
    body_half_width_m: 0.25
    swept_margin_m: 0.10
    swept_min_distance_m: 0.40
    swept_horizon_s: 1.00
    attraction_gain: 0.60
    repulsion_gain: 0.02
    repulsion_cap: 0.25
    candidate_angles_deg: [0, 30, -30, 60, -60, 90, -90]
    turn_in_place_bearing_deg: 35.0
    omega_gain: 0.80

  output_motion:
    max_vx: 0.10
    max_abs_vy: 0.08
    max_abs_omega: 0.25
    accel_vx: 0.15
    decel_vx: 0.30
    accel_vy: 0.15
    decel_vy: 0.30
    accel_omega: 0.50
    decel_omega: 1.00

  web:
    host: 127.0.0.1
    port: 8080
    max_clients: 8
    max_message_bytes: 4096
    max_events_per_second: 20.0
    status_hz: 10.0
    max_visualization_points: 5000

  logging:
    enabled: true
    csv_path: logs/lidar_alx_assisted_follow.csv
    flush_interval_s: 1.0
