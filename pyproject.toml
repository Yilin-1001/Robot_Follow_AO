[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-follow"
version = "0.1.0"
description = "ALX-G100 to Unitree G1 low-speed follow MVP"
# ROS 2 Humble binary packages on Ubuntu 22.04 use Python 3.10.  Keeping the
# project on that baseline prevents accidentally using the old Foxy/Python 3.8
# deployment environment for a Humble backpack.
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
  "numpy>=1.23",
  "aiohttp>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
robot-follow = "robot_follow.main:main"
robot-follow-log = "robot_follow.run_logger:main"
robot-follow-ao-radar = "robot_follow.ao.live.cli:main"
robot-follow-ao-radar-web = "robot_follow.ao.live.web_cli:main"
robot-follow-ao-web = "robot_follow.ao.web.fast_lio_viewer:main"
robot-follow-ao-web-sim = "robot_follow.ao.web.sim_viewer:main"
robot-follow-lidar-alx-assisted-follow = "robot_follow.lidar_alx_assisted_follow.cli:main"
robot-follow-alx-ros = "robot_follow.lidar_alx_assisted_follow.alx_ros_node:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import both the src package and repository scripts.  Importlib mode
# prevents flat test modules with identical basenames in separate feature
# directories from colliding during Python 3.10 collection.
pythonpath = ["src", "."]
addopts = ["--import-mode=importlib"]
asyncio_default_fixture_loop_scope = "function"
