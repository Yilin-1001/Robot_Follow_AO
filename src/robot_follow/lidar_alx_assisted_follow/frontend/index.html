<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiDAR + ALX Assisted Follow</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="header-title">LiDAR Follow Monitor</h1>
      <div class="header-status">
        <span id="connection-state" class="role-badge connecting">Connecting...</span>
      </div>
    </header>

    <main class="main-content">
      <section class="canvas-section">
        <canvas id="lidar-canvas" width="800" height="600"></canvas>
        <div id="calibration-banner" class="calibration-banner">
          PROVISIONAL CALIBRATION
        </div>
      </section>

      <section class="controls-section">
        <div class="status-grid">
          <div class="status-item">
            <span class="status-label">Follow</span>
            <span id="follow-enabled" class="status-value">DISABLED</span>
          </div>
          <div class="status-item">
            <span class="status-label">Motion State</span>
            <span id="motion-state" class="status-value">DISABLED</span>
          </div>
          <div class="status-item">
            <span class="status-label">Wristband</span>
            <span id="wristband-state" class="status-value">UNKNOWN</span>
          </div>
          <div class="status-item">
            <span class="status-label">Stop / block</span>
            <span id="stop-reason" class="status-value">None</span>
          </div>
        </div>

        <div class="command-display">
          <div class="command-item">
            <span class="command-label">requested vx</span>
            <span id="requested-vx" class="command-value">0.00</span>
          </div>
          <div class="command-item">
            <span class="command-label">requested vy</span>
            <span id="requested-vy" class="command-value">0.00</span>
          </div>
          <div class="command-item">
            <span class="command-label">requested ω</span>
            <span id="requested-omega" class="command-value">0.00</span>
          </div>
          <div class="command-item">
            <span class="command-label">sent vx</span>
            <span id="dispatched-vx" class="command-value">0.00</span>
          </div>
          <div class="command-item">
            <span class="command-label">sent vy</span>
            <span id="dispatched-vy" class="command-value">0.00</span>
          </div>
          <div class="command-item">
            <span class="command-label">sent ω</span>
            <span id="dispatched-omega" class="command-value">0.00</span>
          </div>
        </div>

        <div class="control-buttons">
          <button id="start-btn" class="btn btn-start" disabled>Start Follow</button>
          <button id="stop-btn" class="btn btn-stop" disabled>Stop Follow</button>
        </div>

        <div id="error-message" class="error-message hidden"></div>
      </section>
    </main>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
